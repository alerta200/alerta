[build-system]
# PEP 639 (the SPDX `license` expression + [project] license-files below) needs setuptools>=77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-sec"
version = "0.1.3"
description = "Nexus — autonomous red+blue security assessment: reasons like an attacker, reports like a defender, acts only in an authorized scope."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["security", "cybersecurity", "ai-agent", "pentest", "pentesting", "red-team",
    "blue-team", "ethical-hacking", "vulnerability-assessment", "offline", "air-gapped", "claude"]
authors = [{ name = "Diego" }]
# No "License :: OSI Approved ::" classifier — BUSL-1.1 is source-available, not OSI-approved;
# the SPDX `license` field below is the authoritative declaration (PEP 639).
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = "BUSL-1.1"
license-files = ["LICENSE"]
dependencies = []  # stdlib only — runs in an air-gapped box

[project.optional-dependencies]
dev = ["pytest>=7"]
# the trained local brain (the 1.5B student) — heavy ML deps, opt-in so the
# claude/ollama paths stay stdlib-light: `pip install nexus-sec[local]`
local = ["torch", "transformers>=4.44", "peft>=0.11", "accelerate"]
# add 4-bit quantization (fits a 7B base in ~12 GB VRAM): `pip install nexus-sec[local,quant]`
quant = ["bitsandbytes"]
# JS rendering for single-page apps: crawl executes the page in a headless browser so
# runtime-built links, forms, and API calls become visible. Opt-in — the static path works
# without it. After install run `playwright install chromium`.  `pip install nexus-sec[spa]`
spa = ["playwright>=1.40"]
# the full-screen interactive console (pinned input box, slash-command hints, live spinner,
# findings panel — the Claude Code / Gemini shape): `pip install nexus-sec[tui]`. textual drives
# the default full-screen app; rich/prompt_toolkit power the fallback REPL when a terminal can't
# host it. All optional — the plain ANSI REPL works without any of them.
tui = ["textual>=0.60", "rich>=13", "prompt_toolkit>=3"]

[project.urls]
Homepage = "https://github.com/alerta200/alerta"
Repository = "https://github.com/alerta200/alerta"
Issues = "https://github.com/alerta200/alerta/issues"

[project.scripts]
nexus = "redblue.cli:main"
redblue = "redblue.cli:main"  # transitional alias

[tool.setuptools.packages.find]
include = ["redblue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
